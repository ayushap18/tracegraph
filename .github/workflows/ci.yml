name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'  # nightly: the keyless eval suite with live Jev (needs TYPESAFE_API_KEY)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  web:
    name: Web build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  # Routing-only evals (docs/PLAN-accuracy-v2.md D3, D7): every case is routed with Jev's answers replayed from
  # evals/cassettes/jev.jsonl, so no secret is needed and no agent runs. Fails when a tag misses its gate in
  # evals/gates.json, when more than 2% of cases meet a cassette miss, or when the cases changed since the cassette was
  # recorded (refresh it with: python -m jevrouter.evals --mode route --jev record).
  route-evals:
    name: Routing evals (replay)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python -m jevrouter.evals --mode route --jev replay --gates evals/gates.json

  # Keyless eval suite (no answer engine), nightly. Jev itself is a network API, so it needs TYPESAFE_API_KEY and is
  # skipped when the repo secret is not set (forks, or before it is added). Fails when a tag misses its keyless gate.
  evals:
    name: Keyless evals (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - id: key
        run: echo "set=${{ env.TYPESAFE_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.set != 'true'
        run: echo "::notice::TYPESAFE_API_KEY is not set, skipping the eval suite"
      - if: steps.key.outputs.set == 'true'
        uses: actions/checkout@v4
      - if: steps.key.outputs.set == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - if: steps.key.outputs.set == 'true'
        run: pip install -r requirements.txt
      - if: steps.key.outputs.set == 'true'
        run: python -m jevrouter.evals --engine none --gates evals/gates.json
