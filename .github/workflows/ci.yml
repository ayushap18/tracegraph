name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  # Keyless eval suite (no answer engine), but Jev itself is a network API, so it needs TYPESAFE_API_KEY.
  # Skipped when the repo secret is not set (forks, or before it is added). Fails on a regression against evals/baseline.json.
  evals:
    name: Routing evals
    runs-on: ubuntu-latest
    needs: server
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - id: key
        run: echo "set=${{ env.TYPESAFE_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.set != 'true'
        run: echo "::notice::TYPESAFE_API_KEY is not set, skipping the eval suite"
      - if: steps.key.outputs.set == 'true'
        uses: actions/checkout@v4
      - if: steps.key.outputs.set == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - if: steps.key.outputs.set == 'true'
        run: pip install -r requirements.txt
      - if: steps.key.outputs.set == 'true'
        run: python -m jevrouter.evals --engine none
